# Apply database migrations to a hosted Supabase project.
#
# Run it from GitHub → Actions → "Migrate database" → Run workflow.
#   target:   staging or production (each is a GitHub Environment with its own secrets)
#   git_ref:  the branch, tag or commit whose supabase/migrations to apply
#   apply:    leave off for a dry run (lists what would change, touches nothing)
#
# Secrets, per Environment (Settings → Environments → staging / production):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   the project's ref (Project Settings → General)
#   SUPABASE_DB_PASSWORD   the project's database password
#
# Hardening (PR #254 follow-up):
#   - The Supabase secrets exist ONLY on the steps that use them (the
#     secrets check, project link, and the two db push steps) — never as
#     job-level env, so checkout/setup/summary steps never see them.
#   - Third-party actions are pinned to immutable commit SHAs.
#   - The Production Environment requires a reviewer's approval before
#     any job bound to it starts, and its deployments are restricted to
#     the main branch (both configured in the repo's environment
#     settings). Apply runs additionally refuse, in the workflow itself,
#     to run from anything but main or to take migrations from any ref
#     but main — dry runs are unrestricted.
name: Migrate database

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which project to migrate
        type: choice
        options: [staging, production]
        default: staging
      git_ref:
        description: Branch, tag or commit to take migrations from
        type: string
        default: main
      apply:
        description: Apply the migrations (off = dry run only)
        type: boolean
        default: false

# Never run two migrations against the same project at once.
concurrency:
  group: migrate-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: ${{ inputs.apply && 'Apply' || 'Dry run' }} → ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 15
    steps:
      # Apply runs are production writes: they may only execute when the
      # workflow itself was dispatched from main and the migrations come
      # from main. Checked before any secret is touched.
      - name: Guard apply runs
        if: ${{ inputs.apply }}
        run: |
          if [ "${{ inputs.git_ref }}" != "main" ]; then
            echo "::error::Apply runs may only take migrations from main (git_ref='${{ inputs.git_ref }}')."
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Apply runs must be dispatched from the main branch (this run is from '${{ github.ref }}')."
            exit 1
          fi

      - name: Check secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set for the '${{ inputs.target }}' environment"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.git_ref }}

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.107.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # --include-all: some migrations from merged branches carry timestamps
      # older than the newest one already applied; without it they are skipped.
      - name: Pending migrations (dry run)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: ${{ inputs.apply }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.apply && 'Applied' || 'Dry run' }} → ${{ inputs.target }}"
            echo "Migrations from \`${{ inputs.git_ref }}\` ($(git rev-parse --short HEAD))."
          } >> "$GITHUB_STEP_SUMMARY"
